name: Build iOS Device IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub's Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15 # Use macOS 15 to get Xcode 16.1+
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned iOS App
        run: |
          # Ensure Xcode's internal React Native script can find Node.js in the GitHub Action
          export NODE_BINARY=$(which node)
          
          # Build the app for physical iPhones using Ad-Hoc signing so CocoaPods embeds frameworks
          xcodebuild -workspace ios/AttendanceApp.xcworkspace \
            -scheme AttendanceApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          # Guarantee the JavaScript bundle is generated and injected into the app (fixes white screen crash)
          npx react-native bundle \
            --entry-file index.js \
            --platform ios \
            --dev false \
            --bundle-output ios/build/Build/Products/Release-iphoneos/AttendanceApp.app/main.jsbundle \
            --assets-dest ios/build/Build/Products/Release-iphoneos/AttendanceApp.app

          # An .ipa file is literally just a zip file containing a folder named "Payload"
          mkdir -p Payload
          mv ios/build/Build/Products/Release-iphoneos/AttendanceApp.app Payload/
          zip -r AttendanceApp-Device.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-Device-IPA
          path: AttendanceApp-Device.ipa
          retention-days: 7
