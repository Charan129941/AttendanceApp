name: iOS Simulator Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Link iOS Native Modules
        run: |
          cd ios
          gem install xcodeproj
          ruby link_native_modules.rb

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (Simulator)
        run: |
          cd ios
          xcodebuild \
            -workspace AttendanceApp.xcworkspace \
            -scheme AttendanceApp \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            build

      - name: Zip the .app for Simulator
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r AttendanceApp-Simulator.zip AttendanceApp.app

      - name: Commit and Push iOS Simulator Zip to dist/
        run: |
          mkdir -p dist
          cp ios/build/Build/Products/Release-iphonesimulator/AttendanceApp-Simulator.zip dist/
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/AttendanceApp-Simulator.zip
          git commit -m "ci: update iOS simulator artifact [skip ci]" || echo "No changes"
          git push

